name: Test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  build:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*
      - run: |
          python -m venv /tmp/vintagecheck-check
          /tmp/vintagecheck-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/vintagecheck-check/bin/vintagecheck --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(basename dist/*.tar.gz .tar.gz)
          version=${version#vintagecheck-}
          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$(git ls-remote origin "refs/tags/v$version" | cut -f1)" != "$GITHUB_SHA" ]; then exit 0; fi
          else
            gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "VintageCheck $version" --notes "Point-in-time vintage auditing with a Python API, command-line interface and reproducible US GDP example."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
