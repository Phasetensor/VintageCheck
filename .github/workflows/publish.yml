name: Test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  science:
    uses: ./.github/workflows/science.yml
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[tables]"
      - if: matrix.python == '3.12'
        run: python -m pip install ".[large,calendars]"
      - run: python -m examples.research_audit
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.scale --pandas
  build:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*
      - run: |
          python -m venv /tmp/vintagecheck-check
          /tmp/vintagecheck-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/vintagecheck-check/bin/vintagecheck --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [build, science]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(basename dist/*.tar.gz .tar.gz)
          version=${version#vintagecheck-}
          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$(git ls-remote origin "refs/tags/v$version" | cut -f1)" != "$GITHUB_SHA" ]; then exit 0; fi
          else
            gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "VintageCheck $version" --notes "Historical universes, corporate actions, feature lineage, temporal folds, research reports and streaming Parquet audit backends."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  verify:
    runs-on: ubuntu-22.04
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tagged commit and GitHub asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(basename dist/*.tar.gz .tar.gz)
          tag="v${version#vintagecheck-}"
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-list -1 "$tag")" = "$GITHUB_SHA"
          gh release download "$tag" --dir /tmp/release-assets
          for path in dist/*; do cmp "$path" "/tmp/release-assets/$(basename "$path")"; done
      - name: Verify PyPI hashes and run published CLI outside checkout
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/vintagecheck/{version}/json", timeout=10) as r:
                      remote = {f["filename"]: f["digests"]["sha256"] for f in json.load(r)["urls"]}
                  break
              except OSError:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("dist").iterdir()}
          assert local == remote and len(local) == 2
          PY
          version=$(basename dist/*.tar.gz .tar.gz)
          cd /tmp
          for delay in 0 10 20 30 60; do
            sleep "$delay"
            python -m pip install --no-cache-dir --index-url https://pypi.org/simple "vintagecheck==${version#vintagecheck-}" && break
          done
          python -c "from vintagecheck.large import audit_parquet; from vintagecheck.market import MarketSessions; from vintagecheck.research import audit_backtest"
          vintagecheck "$GITHUB_WORKSPACE/examples/releases.csv" "$GITHUB_WORKSPACE/examples/decisions.csv" --threshold 1.5 > audit.json
          python -c "import json; r=json.load(open('audit.json')); assert r['summary']['FAIL']==1 and r['first_future_row']==1"
