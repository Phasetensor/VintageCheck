name: Consolidation evidence
on:
  push:
    branches: [scientific-consolidation]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [python, pandas, pyarrow, duckdb, polars]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[large,tables]'
      - run: python -m benchmarks.consolidation --backend ${{ matrix.backend }}
      - run: cat "benchmarks/evidence/${{ matrix.backend }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: measurements-${{ matrix.backend }}
          path: |
            benchmarks/evidence/${{ matrix.backend }}.csv
            benchmarks/evidence/${{ matrix.backend }}.json
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[large,tables,calendars]' coverage hypothesis ruff mypy build twine scikit-learn curvemetric==1.5.0
      - run: python -m benchmarks.case_studies
      - run: cat benchmarks/evidence/cases.json
      - run: coverage run --source=vintagecheck --branch -m unittest discover -s tests -v && coverage json -o benchmarks/evidence/coverage.json
      - name: Build and verify release candidate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          sha256sum dist/* | tee benchmarks/evidence/distributions.sha256
          python - <<'PYCODE'
          import glob,tarfile,zipfile
          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as z:
              assert "vintagecheck/py.typed" in z.namelist()
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as t:
              assert any(n.endswith("/benchmarks/consolidation.py") for n in t.getnames())
          PYCODE
          root=$PWD
          python -m venv /tmp/vc-clean
          /tmp/vc-clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/vc-clean/bin/python "$root/examples/research_audit.py"
          /tmp/vc-clean/bin/vintagecheck "$root/examples/releases.csv" "$root/examples/decisions.csv" --threshold 1.5
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: case-studies-and-coverage
          path: benchmarks/evidence/
      - run: |
          python - <<'PY'
          import json
          c=json.load(open("benchmarks/evidence/coverage.json"))
          for k,v in c["files"].items(): print(k, v["missing_lines"],v["missing_branches"])
          t=c["totals"];print(t)
          assert t["covered_lines"]/t["num_statements"] >= .95
          assert t["covered_branches"]/t["num_branches"] >= .90
          PY
      - if: always()
        run: ruff check vintagecheck && ruff format --check vintagecheck
      - if: always()
        run: mypy --ignore-missing-imports --check-untyped-defs vintagecheck
  core:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.research_audit
